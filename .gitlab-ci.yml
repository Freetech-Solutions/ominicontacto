include:
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: '$FULL == "true"'
  - project: 'omnileads/devsecops'
    ref: 'develop'
    file:
      - 'templates/security-scans.yml'
      - 'templates/gitleaks.yml'
      - 'templates/owasp-dependency-check.yml'
      - 'templates/sonarqube.yml'
      - 'templates/docker-build-push.yml'

variables:
  IMAGE_NAME: "omlapp"
  IMAGE_VERSION: ""
  # Valores válidos: omnileads | freetechsolutions. Vacío = según rama (master → omnileads).
  DOCKER_ORG: ""
  FULL: ""
  BUILD: ""
  # ARM64=true → multi-arch amd64+arm64 (requiere template docker-build-push con opt-in).
  # Default: solo amd64. DOCKER_PLATFORMS fija amd64 aunque el template remoto aún
  # defaultée multi-arch; con ARM64=true el template nuevo amplía a amd64+arm64.
  ARM64: ""
  DOCKER_PLATFORMS: "linux/amd64"
  # SKIP_OWASP=true → omite owasp_dependency_scan y owasp_defectdojo_upload (útil con FULL=true).
  SKIP_OWASP: ""
  # SKIP_TESTS=true → omite test:django, test:flake8 y test:eslint (útil con FULL=true).
  SKIP_TESTS: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  TRIVY_SEVERITY: "CRITICAL"
  # DefectDojo: nombre del Product (Asset) en DefectDojo.
  # Para la estrategia "1 Repo = 1 Producto", mantén vacía la variable DEFECTDOJO_ENGAGEMENT_ID en GitLab
  # y este script creará/resolverá el producto y el engagement "Continuous Security" automáticamente.
  DEFECTDOJO_PRODUCT_NAME: "OMLApp"
  OWASP_PROJECT_NAME: "OMLApp"
  # SCA: solo manifiestos Python/Node (evita escanear JS estático del repo).
  OWASP_SCAN_PATH: "requirements"
  OWASP_ADDITIONAL_ARGS: "--scan omnileads_ui --disableNodeAudit --disableOssIndex"
  OWASP_IMAGE_TAG: "12.2.2"
  # DefectDojo con certificado interno/auto-firmado (override en CI/CD si usan CA pública).
  DEFECTDOJO_INSECURE: "true"
  SONAR_INSECURE: "true"
  # Cobertura vía ADDITIONAL_ARGS; exclusiones OWASP/htmlcov vienen del template (SONAR_EXCLUSIONS).
  SONAR_ADDITIONAL_ARGS: "-Dsonar.python.coverage.reportPaths=coverage.xml"
  SONAR_EXCLUSIONS: "**/dependency-check-reports/**,**/*dependency-check-report*,**/htmlcov/**,**/.sonar/**,**/node_modules/**,**/static/**/JS/ext/**"
  # Sin variables → sonarqube, build, security_scan y security_report.
  # BUILD=true → solo build (container-image).
  # FULL=true → pipeline completo: tests, SAST, gitleaks, sonarqube, build y escaneos de seguridad.
  # FULL=true + SKIP_OWASP=true → igual que FULL, sin OWASP.
  # FULL=true + SKIP_TESTS=true → igual que FULL, sin tests (django/flake8/eslint).

stages:
  - security
  - test
  - sonarqube
  - build
  - security_scan
  - security_report

.full-pipeline-rules: &full-pipeline-rules
  rules:
    - if: '$SKIP_TESTS == "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'

.sonar-rules: &sonar-rules
  rules:
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'

.build-rules: &build-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'

# Las reglas de Trivy se heredan por defecto de la plantilla central

.gitleaks-rules: &gitleaks-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'

.owasp-rules: &owasp-rules
  rules:
    - if: '$SKIP_OWASP == "true"'
      when: never
    - if: '$BUILD == "true" && $FULL != "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master-.*$/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^develop-.*$/)'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^master-.*$/ || $CI_COMMIT_BRANCH =~ /^develop-.*$/)'

test:django:
  stage: test
  image: docker:27.5.1-alpine3.21
  services:
    - docker:27.5.1-dind-alpine3.21
  before_script:
    - apk add --no-cache docker-cli-compose docker-cli-buildx git
  script:
    - >-
      docker compose -f docker-compose.test.ci.yml
      run --rm django-test
  after_script:
    - docker compose -f docker-compose.test.ci.yml down -v --remove-orphans || true
  artifacts:
    # Conservar el reporte de cobertura para SonarQube
    paths:
      - coverage.xml
    expire_in: 1 week
  <<: *full-pipeline-rules

test:flake8:
  stage: test
  image: python:3.12-slim-trixie
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir flake8
  script:
    - |
      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
        git fetch --no-tags origin \
          "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" \
          || true
      fi
    - bash check-python.sh
  <<: *full-pipeline-rules

test:eslint:
  stage: test
  image: node:18-slim
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - npm install -g eslint@8
  script:
    - git fetch --no-tags origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" || true
    - bash check-js.sh
  <<: *full-pipeline-rules

sonarqube_scan:
  needs:
    # Con FULL=true usa cobertura de django; en pipeline default el artefacto es opcional
    - job: test:django
      artifacts: true
      optional: true
  <<: *sonar-rules

sonarqube_defectdojo_upload:
  <<: *sonar-rules

container-image:
  extends: .docker_container_image
  stage: build
  variables:
    IMAGE_NAME: omlapp
    DOCKERFILE_PATH: Dockerfile
    BUILD_CONTEXT: .
    REQUIRE_OMNILEADS_VERSION_FILE: "true"
    DOCKER_RELEASE_BRANCH_REGEX: "^(master)$"
  artifacts:
    paths:
      - omlapp.tar
    expire_in: 90 days

  <<: *build-rules
# Los jobs trivy_scan, defectdojo_upload, gitleaks_defectdojo_upload, owasp_defectdojo_upload y sonarqube_defectdojo_upload se heredan de devsecops.

# GitLab no expande ${GITLEAKS_STAGE} del template incluido en el campo stage.
gitleaks_scan:
  stage: security
  <<: *gitleaks-rules

# GitLab no expande ${OWASP_SCAN_STAGE} del template incluido en el campo stage.
owasp_dependency_scan:
  stage: security
  <<: *owasp-rules

owasp_defectdojo_upload:
  <<: *owasp-rules
