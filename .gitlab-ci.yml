include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  IMAGE_VERSION: ""
  # Valores válidos: omnileads | freetechsolutions. Vacío = según rama (master → omnileads).
  DOCKER_ORG: ""

stages:
  - test
  - build

.test-rules: &test-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master")'

test:django:
  stage: test
  image: docker:27.5.1-alpine3.21
  services:
    - docker:27.5.1-dind-alpine3.21
  before_script:
    - apk add --no-cache docker-cli-compose docker-cli-buildx git
  script:
    - >-
      docker compose -f docker-compose.test.ci.yml
      run --rm django-test
  after_script:
    - docker compose -f docker-compose.test.ci.yml down -v --remove-orphans || true
  <<: *test-rules

test:flake8:
  stage: test
  image: python:3.12-slim-trixie
  before_script:
    - pip install --no-cache-dir flake8
  script:
    - flake8
  <<: *test-rules

test:eslint:
  stage: test
  image: node:18-slim
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - npm install -g eslint@8
  script:
    - git fetch --no-tags origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" || true
    - bash check-js.sh
  <<: *test-rules

container-image:
  services:
    - docker:27.5.1-dind-alpine3.21
  image: docker:27.5.1-alpine3.21
  stage: build
  before_script:
    - apk add --no-cache docker-cli-buildx git
  script:
    - >-
      docker buildx build
      --file=Dockerfile
      --tag=run
      --target=run
      --load
      .
    - |-
      if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_SECRET}" ] || [ -z "${DOCKER_USER}" ] || [ -z "${DOCKER_PASSWORD}" ]; then
        echo "Error: Una o más variables necesarias no están definidas."
        exit 1
      fi

      if [ -z "$(cat .omnileads_version)" ]; then
        echo "Error: El archivo .omnileads_version no existe o está vacío."
        exit 1
      fi

      if [ -z "${IMAGE_VERSION}" ]; then
        IMAGE_VERSION="$(date +%Y%m%d)-${CI_COMMIT_SHORT_SHA}"
      fi

      if [ -n "${DOCKER_ORG}" ]; then
        if [[ "${DOCKER_ORG}" != "omnileads" && "${DOCKER_ORG}" != "freetechsolutions" ]]; then
          echo "Error: DOCKER_ORG debe ser 'omnileads' o 'freetechsolutions'."
          exit 1
        fi
        PUSH_ORG="${DOCKER_ORG}"
      elif [[ "${CI_COMMIT_BRANCH}" == "master" ]]; then
        PUSH_ORG="omnileads"
      else
        PUSH_ORG="freetechsolutions"
      fi

      if [[ "${PUSH_ORG}" == "omnileads" ]]; then
        echo "${DOCKER_SECRET}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
      else
        echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USER}" --password-stdin
      fi

      docker tag run ${PUSH_ORG}/omlapp:$IMAGE_VERSION
      docker push docker.io/${PUSH_ORG}/omlapp:$IMAGE_VERSION
  only:
    - web