# Docker Compose para ejecutar tests de Django (Postgres + Redis + runner)
# Uso: ./run_tests.sh [opciones para manage.py test]

services:
  postgres:
    image: postgres:18-trixie
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: omnileads
      POSTGRES_PASSWORD: omnileads
      POSTGRES_DB: omnileads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnileads"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  django-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnileads-django-test:latest
    container_name: omnileads-django-test
    user: "0:0"
    working_dir: /opt/omnileads/ominicontacto
    volumes:
      - .:/opt/omnileads/ominicontacto
    environment:
      PGHOST: postgres
      PGPASSWORD: omnileads
      REDIS_HOSTNAME: redis
      DEFENDER_REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["python", "manage.py", "test", "--settings=ominicontacto.settings.tests_docker"]
