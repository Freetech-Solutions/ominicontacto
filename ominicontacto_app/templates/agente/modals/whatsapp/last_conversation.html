{% load static %}
{% load i18n %}

<div class="modal fade" id="last-conversation-messages-modal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg modal-dialog-centered last-conversation-dialog" role="document">
        <div class="modal-content last-conversation-modal">

            <div class="modal-header last-conversation-header drag-handle">
                <div>
                    <div class="last-conversation-header__title">
                        {% trans "Última conversación" %}
                    </div>
                    <div class="last-conversation-header__subtitle">
                        {% trans "Solo lectura" %}
                    </div>
                </div>

                <button
                    type="button"
                    class="last-conversation-header__close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    &times;
                </button>
            </div>

            <div class="modal-body last-conversation-body">
                <iframe
                    class="whatsapp_iframe_container"
                    src="about:blank"
                    data-src="{% static 'omnileads-frontend/agent_whatsapp_last_conversation.html' %}"
                    loading="lazy"
                ></iframe>
            </div>

        </div>
    </div>
</div>
